<!doctype html>
<html lang="en" data-type="software" data-radius="round">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shadowday: photograph credits</title>
<meta name="description" content="The photographers, licences and source pages of the photographs on the Shadowday website.">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="system.css">
<style>
:root { --p-bg: #000000; --p-surface: #0d0d0d; --p-ink: #ffffff; --p-muted: #999999; --p-accent: #93f1f7; --p-accent-ink: #000000; --p-action: #93f1f7; --p-action-ink: #000000;
  --font-display: system-ui, sans-serif; --font-text: system-ui, sans-serif; }
main { padding-block: var(--s-9); display: grid; gap: var(--s-6); }
.credits-list { display: grid; gap: var(--s-5); }
.credits-list ul { display: grid; gap: var(--s-3); }
.credits-list a, main > p a { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
</style>
</head>
<body>
<main class="wrap">
  <p><a class="link" href="../index.html">Shadowday</a></p>
  <section class="credits-list" id="credits" aria-labelledby="credits-h">
    <h1 id="credits-h">Photograph credits</h1>
    <ul>
      <li><a href="https://commons.wikimedia.org/wiki/File:Liwa_Oasis_palm_trees_with_the_desert_view.jpg">Josephyousry</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0">CC BY-SA 4.0</a>, adapted</li>
      <li><a href="https://commons.wikimedia.org/wiki/File:Falaj_at_al_ain.jpg">Bob McCaffrey</a>, <a href="https://creativecommons.org/licenses/by-sa/2.0">CC BY-SA 2.0</a>, adapted</li>
      <li><a href="https://commons.wikimedia.org/wiki/File:Al_Hajar_Mountains_near_Kalba_dam.jpg">AmethystDreams</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0">CC BY-SA 4.0</a>, adapted</li>
      <li><a href="https://commons.wikimedia.org/wiki/File:Continuous_Construction.jpg">Clémence Jacqueri</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0">CC BY-SA 4.0</a>, adapted</li>
    </ul>
  </section>
  <p class="t-small muted">Each photograph is cropped to fit its frame on the page.</p>
</main>
</body>
</html>
